name: Auto run simple suite

on:
  pull_request: 
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-simple-suite:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright browsers
        run: yarn playwright install chromium

      - name: Run simple suite
        run: yarn playwright test --project=chromium --grep @smoke

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: simple-suite-results-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

  post-slack-notification-started:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date and time
        id: date
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          RUN_TIME=$(date -u +%H:%M:%S)
          echo "date=$RUN_DATE" >> $GITHUB_OUTPUT
          echo "time=$RUN_TIME" >> $GITHUB_OUTPUT

      - name: Post a message in a channel
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "🚀 Simple suite pipeline started"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    text: "📅 ${{ steps.date.outputs.date }} 🕒 ${{ steps.date.outputs.time }} UTC"
              - type: "divider"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} | View workflow run>"